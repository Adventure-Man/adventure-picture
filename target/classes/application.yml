server:
  port: 8081
  servlet:
    context-path: /api
    session:
      timeout: 60m
      #      设置cookie的过期时间1个 月
      cookie:
        max-age: 2592000
spring:
  session:
    store-type: redis
    timeout: 2592000
  servlet:
    multipart:
      max-file-size: 10MB
  application:
    name: picture-service
  profiles:
    active: dev
  datasource:
      url: jdbc:mysql://${mysql.host}:${mysql.port}/${mysql.database}?useUnicode=true&characterEncoding=UTF-8&allowMultiQueries=true&useSSL=false&serverTimezone=Asia/Shanghai
      username: ${mysql.username}
      password: ${mysql.password}
      driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      database: 3
      host: 127.0.0.1
      port: 6379
      # password:
      # 连接超时时间
      timeout: 10s
      lettuce:
        pool:
          # 连接池最大连接数
          max-active: 200
          # 连接池最大阻塞等待时间（使用负值表示没有限制）
          max-wait: -1ms
          # 连接池中的最大空闲连接
          max-idle: 10
          # 连接池中的最小空闲连接
          min-idle: 0

sa-token:
  token-header-name: Authorization
  redis-timeout: 1000
  timeout: 2592000
  jwt-secret-key: clt74GDp0svH9nxZuXqFjEL1BsGmDf85
  is-concurrent: false
  is-print: true # 开发环境建议开启日志输出
  token-style: uuid
  max-login-count: 5


mybatis-flex:
  configuration:
    map-underscore-to-camel-case: false
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    logic-delete-column: flag_delete
    deleted-value-of-logic-delete: 1
    normal-value-of-logic-delete: 0


# springdoc-openapi项目配置
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'api'
      paths-to-match: '/**'
      packages-to-scan: com.adventure.picturebackend.controller
# knife4j的增强配置，不需要增强可以不配
knife4j:
  enable: true
  setting:
    language: zh_cn

cos:
  client:
    bucket: ${cos.client.bucket}
    host: ${cos.client.host}
    region: ${cos.client.region}
    secret-id: ${cos.client.secret-id}
    secret-key: ${cos.client.secret-key}
# 空间配置
space:
  capacity:
    max-count: 100
    # 100M
    max-size: 104857600
    ordinary:
      max-count: 100
      max-size: 104857600
    professional:
      max-count: 1000
      # 1000M
      max-size: 1048576000
    flagship:
      max-count: 10000
      # 10000M
      max-size: 10485760000

# 阿里云 AI 配置
aliYunAi:
  apiKey: xxxx
